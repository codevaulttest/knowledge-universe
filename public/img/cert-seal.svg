<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- 盾牌三面伪 3D（左亮 / 右中 / 底暗），与 Wiseverse 印章同构，颜色为知识宇宙金 -->
    <path d="M60 8 L104 26 L104 58 C104 84 84 100 60 112 L60 8 Z" fill="#EAD28E" />
    <path d="M60 8 L16 26 L16 58 C16 84 36 100 60 112 L60 8 Z" fill="#C8A96E" />
    <path d="M60 66 L104 58 C102 82 84 98 60 110 L60 66 Z" fill="#976C30" />
    <path d="M60 66 L16 58 C18 82 36 98 60 110 L60 66 Z" fill="#8A5F28" />
  </g>
  <!-- 知识节点符号：中心节点 + 三个环绕子节点，象征知识确权的链接关系 -->
  <g fill="none" stroke="#080808" stroke-width="3.4" stroke-linecap="round">
    <line x1="60" y1="60" x2="60" y2="38" />
    <line x1="60" y1="60" x2="40" y2="72" />
    <line x1="60" y1="60" x2="80" y2="72" />
  </g>
  <circle cx="60" cy="60" r="9" fill="#080808" />
  <circle cx="60" cy="38" r="5" fill="#080808" />
  <circle cx="40" cy="72" r="5" fill="#080808" />
  <circle cx="80" cy="72" r="5" fill="#080808" />
  <!-- 外圈勾线描绘动画 -->
  <path d="M60 8 L104 26 L104 58 C104 84 84 100 60 112 C36 100 16 84 16 58 L16 26 Z"
        fill="none" stroke="#EAD28E" stroke-width="2.5" stroke-dasharray="330" stroke-dashoffset="330">
    <animate attributeName="stroke-dashoffset" from="330" to="0" dur="0.6s" begin="0.1s" fill="freeze" />
  </path>
</svg>
